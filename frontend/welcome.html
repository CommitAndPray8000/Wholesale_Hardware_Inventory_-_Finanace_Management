<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Standard Traders</title>
  <link rel="stylesheet" href="welcome.css">
  <link rel="icon" type="image/png" href="assets/STK_logo-removebg-preview.png">
</head>
<body>
  <!-- Top Bar with Admin Option -->
  <header class="welcome-header">
    <a href="/login/" class="btn-admin" id="btn-admin-portal" title="Enter Admin / Staff Portal">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
      <span>Admin</span>
    </a>
  </header>

  <!-- Main Hero: Welcome to Standard [Logo] Traders -->
  <main class="welcome-main">
    <div class="welcome-content">
      <h1 class="welcome-title">
        <span class="text-gradient">Welcome to Standard</span>
        <img src="assets/STK_logo-removebg-preview.png" alt="Standard Traders Logo" class="company-logo" id="company-brand-logo">
        <span class="text-gradient">Traders</span>
      </h1>
    </div>
  </main>
</body>
</html>
